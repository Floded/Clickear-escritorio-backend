services:
  postgres:
    image: postgres:16-alpine
    container_name: clickear-postgres
    environment:
      POSTGRES_USER: clickear
      POSTGRES_PASSWORD: clickear_dev
      POSTGRES_DB: clickear
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickear -d clickear"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clickear-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
